# Production docker-compose with PostgreSQL, Redis, Nginx
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: caregrid_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=caregrid
      - POSTGRES_USER=caregrid
      - POSTGRES_PASSWORD=${DB_PASSWORD:-caregrid_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caregrid"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caregrid_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: caregrid_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caregrid_network
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caregrid_django
    command: gunicorn caregrid.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./ai_uploads:/app/ai_uploads
    environment:
      - DJANGO_SETTINGS_MODULE=caregrid.settings
      - DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=caregrid
      - DB_USER=caregrid
      - DB_PASSWORD=${DB_PASSWORD:-caregrid_secret}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_HOSTS=localhost,127.0.0.1,api.caregrid.io
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,https://caregrid.io
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - AI_LLM_PROVIDER=${AI_LLM_PROVIDER:-openai}
      - AI_LLM_MODEL=${AI_LLM_MODEL:-gpt-4o-mini}
      - AI_LLM_API_KEY=${AI_LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - caregrid_network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caregrid_migrate
    command: >
      sh -c "python manage.py migrate --noinput"
    volumes:
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=caregrid.settings
      - DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=caregrid
      - DB_USER=caregrid
      - DB_PASSWORD=${DB_PASSWORD:-caregrid_secret}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - caregrid_network
    restart: "no"

  nginx:
    image: nginx:1.25-alpine
    container_name: caregrid_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./staticfiles:/staticfiles:ro
      - ./media:/media:ro
    depends_on:
      - django
    networks:
      - caregrid_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  caregrid_network:
    driver: bridge
