services:
  redis:
    image: redis:7-alpine
    container_name: caregrid_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caregrid_network

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caregrid_django
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
      - ./ai_uploads:/app/ai_uploads
    environment:
      - DJANGO_SETTINGS_MODULE=caregrid.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,django
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - caregrid_network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caregrid_migrate
    command: sh -c "python manage.py migrate --noinput"
    volumes:
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=caregrid.settings
      - REDIS_HOST=redis
      - DEBUG=True
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - caregrid_network
    restart: "no"

volumes:
  redis_data:

networks:
  caregrid_network:
    driver: bridge
