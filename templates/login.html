<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareGrid X - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,.15); }
        .login-header { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; border-radius: 1rem 1rem 0 0; padding: 2rem; text-align: center; }
        .login-body { padding: 2rem; }
        .brand-icon { font-size: 3rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card">
                    <div class="login-header">
                        <i class="bi bi-heart-pulse brand-icon"></i>
                        <h2 class="mt-2">CareGrid X</h2>
                        <p class="mb-0 opacity-75">Enterprise AI-Native Healthcare Platform</p>
                    </div>
                    <div class="login-body">
                        {% if form.errors %}
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            Invalid username or password. Please try again.
                        </div>
                        {% endif %}
                        {% if next and not form.errors %}
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle me-2"></i>
                            Please log in to continue.
                        </div>
                        {% endif %}
                        <form method="post" action="{% url 'login' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
                                <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter your username" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
                                <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter your password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                            </button>
                            <input type="hidden" name="next" value="{{ next }}">
                        </form>
                    </div>
                </div>
                <p class="text-center text-white mt-3 opacity-75">
                    <i class="bi bi-shield-check me-1"></i>
                    Secure Healthcare Platform
                </p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
